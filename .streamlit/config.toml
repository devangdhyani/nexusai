[theme]
base                   = "dark"
primaryColor           = "#8B5CF6"
backgroundColor        = "#050816"
secondaryBackgroundColor = "#0d1b3e"
textColor              = "#e2e8f0"
font                   = "sans serif"

[server]
headless         = true
enableCORS       = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[runner]
fastReruns = true
